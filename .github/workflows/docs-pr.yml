name: Docs (PR build check)

# Builds the repo's Sphinx docs on a pull request that touches docs, and fails
# if the build errors — a regression gate for documentation. Uploads the built
# HTML as an artifact so reviewers can preview. No AWS; runs on self-hosted to
# avoid GitHub-hosted minutes (SPEC-174).

on:
  pull_request:
    paths:
      - "docs/**"
      - "engine/**"
      - "frontend/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Set up docs toolchain (Python 3.13)
        run: |
          uv venv --python 3.13 .docs-venv
          . .docs-venv/bin/activate
          # Shared config + tooling deps. The repo vendors deloitte_sphinx under
          # docs/sphinx/_ext, so the build works even without the index install.
          uv pip install -r docs/sphinx/requirements.txt

      - name: Build HTML (fail on Sphinx errors)
        run: |
          . .docs-venv/bin/activate
          sphinx-build -b html -W --keep-going \
            docs/sphinx docs/sphinx/_build/html 2> docs/sphinx/_sphinx_warnings.txt || true
          # Hard-fail only on real build errors (not the app's own docstring
          # warnings, which are reported but non-blocking per the docs rollout).
          if [ ! -f docs/sphinx/_build/html/index.html ]; then
            echo "::error::Sphinx build did not produce index.html"
            sed 's/^/  /' docs/sphinx/_sphinx_warnings.txt | tail -40
            exit 1
          fi
          echo "Docs built OK."

      - name: Upload HTML preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html-${{ github.event.repository.name }}-${{ github.sha }}
          path: docs/sphinx/_build/html
          retention-days: 7
