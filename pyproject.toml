[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vesta"
version = "0.1.0"
description = "What a change touches — a domain model of a codebase, and bounded propagation over it"
requires-python = ">=3.10"
# Resolution, not just parsing. The standard library's `ast` gives syntax and no
# name resolution: it cannot tell that `found.describe()` refers to
# `Coherence.describe` rather than to any of the three other `describe` methods
# in the same package. Jedi resolved that correctly and only for Python; a tool
# that must resolve C, Rust, Go, OCaml and the rest cannot be built on it. The
# language servers do the resolution instead, so the only dependency left is the
# one that shapes the data — everything else is the standard library.
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
# Structuring what was acquired into a queryable corpus. Optional because
# acquisition alone is useful: without these, readings are written to disk and a
# person reads them.
#
# Four of the five are path installs and pip will not resolve them from a name:
#   pip install -e '../pragmatos[pipelines]' -e ../metis -e ../deps/stroma -e ../deps/kanon
# `kanon` in particular is deliberately not a named dependency anywhere — an
# unrelated package owns that name on PyPI.
theory = [
  "sentence-transformers>=3.0",  # embeddings; without it retrieval is lexical only
]
# Running as a sidecar to a coding agent over MCP.
sidecar = [
  "mcp>=1.0",
]

[project.scripts]
vesta = "vesta.cli:main"
vesta-sidecar = "vesta.sidecar:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
